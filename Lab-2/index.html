<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 2 - Responsive Navbar and Grid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-md bg-dark navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Logo</a>
      <a class="nav-link text-white ms-auto me-2 order-md-2" href="#">🛒</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse order-md-1" id="menu">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
      <script>
        for (let i = 1; i <= 8; i++) {
          document.currentScript.insertAdjacentHTML("beforebegin", `
            <div class="col">
              <div class="card h-100">
                <img src="https://placehold.co/400x300?text=Product+${i}" class="card-img-top" alt="Product ${i}">
                <div class="card-body">
                  <h5 class="card-title">Product ${i}</h5>
                  <p class="card-text">$${i * 10}.00</p>
                </div>
              </div>
            </div>`);
        }
      </script>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
