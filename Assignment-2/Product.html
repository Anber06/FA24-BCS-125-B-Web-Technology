<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solemate – Classic Low Top</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-md navbar-dark site-nav">
    <div class="container">
      <a class="navbar-brand" href="index.html">Solemate</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="#">Women</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Men</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Kids</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Accessories</a></li>
        </ul>
        <a class="btn btn-outline-light btn-sm" href="#">🛒 Cart</a>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div class="row g-4">
      <div class="col-12 col-md-6">
        <img src="images/shoes2.jpg" class="img-fluid rounded" alt="Classic Low Top">
      </div>
      <div class="col-12 col-md-6">
        <h1>Classic Low Top</h1>
        <p class="fs-3 fw-bold">$65.00</p>
        <p>A comfortable, durable everyday sneaker with a cushioned sole and a timeless canvas upper.</p>
        <div class="d-flex align-items-center gap-3">
          <label for="qty" class="fw-semibold">Quantity</label>
          <input type="number" id="qty" class="form-control qty" value="1" min="1">
        </div>
        <button class="btn btn-dark btn-lg mt-3">Add to Cart</button>
      </div>
    </div>
  </main>

  <footer class="site-nav text-light mt-auto py-4">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
      <span>&copy; 2026 Solemate</span>
      <span><a href="#" class="text-light me-3">Privacy</a><a href="#" class="text-light">Terms</a></span>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
