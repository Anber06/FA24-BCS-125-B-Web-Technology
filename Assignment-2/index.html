<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solemate – Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-md navbar-dark site-nav">
    <div class="container">
      <a class="navbar-brand" href="index.html">Solemate</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="#">Women</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Men</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Kids</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Accessories</a></li>
        </ul>
        <a class="btn btn-outline-light btn-sm" href="#">🛒 Cart</a>
      </div>
    </div>
  </nav>

  <img src="images/shoes1.jpg" class="banner" alt="Sneakers banner">

  <main class="container my-4">
    <h1 class="mb-4">Sneakers</h1>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4">
      <div class="col">
        <div class="card h-100">
          <a href="product.html"><img src="images/shoes2.jpg" class="card-img-top" alt="Classic Low Top"></a>
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Classic Low Top</h5>
            <p class="card-text fw-bold">$65.00</p>
            <button class="btn btn-dark mt-auto">Add to Cart</button>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card h-100">
          <a href="product.html"><img src="images/shoes3.jpg" class="card-img-top" alt="High Top Canvas"></a>
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">High Top Canvas</h5>
            <p class="card-text fw-bold">$75.00</p>
            <button class="btn btn-dark mt-auto">Add to Cart</button>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card h-100">
          <a href="product.html"><img src="images/shoes4.jpg" class="card-img-top" alt="Retro Runner"></a>
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Retro Runner</h5>
            <p class="card-text fw-bold">$89.00</p>
            <button class="btn btn-dark mt-auto">Add to Cart</button>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card h-100">
          <a href="product.html"><img src="images/shoes5.jpg" class="card-img-top" alt="Court Classic"></a>
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Court Classic</h5>
            <p class="card-text fw-bold">$70.00</p>
            <button class="btn btn-dark mt-auto">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-nav text-light mt-auto py-4">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
      <span>&copy; 2026 Solemate</span>
      <span><a href="#" class="text-light me-3">Privacy</a><a href="#" class="text-light">Terms</a></span>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
